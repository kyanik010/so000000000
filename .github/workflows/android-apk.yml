name: Android APK and unit tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "backup/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'SONIX release version name, for example 2.1.0'
        required: true
        type: string
      version_code:
        description: 'Android versionCode; must be greater than every installed release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sonix-release-key.p12"
          test -s "$RUNNER_TEMP/sonix-release-key.p12"
          chmod 600 "$RUNNER_TEMP/sonix-release-key.p12"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          KEYSTORE_PATH: ${{ runner.temp }}/sonix-release-key.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "VERSION_CODE must be a positive integer"; exit 1; }
            (( VERSION_CODE <= 2147483647 )) || { echo "VERSION_CODE exceeds Android's integer limit"; exit 1; }
            [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,39}$ ]] || { echo "VERSION_NAME contains unsupported characters"; exit 1; }
          fi
          gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sonix-tv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sonix-release-key.p12"

  publish-release:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: sonix-tv-release-apk
          path: release-assets

      - name: Generate SHA-256 manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release-assets/*.apk)
          test "${#apks[@]}" -eq 1
          sha256sum "${apks[0]}" > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sonix-v${{ github.event.inputs.version_name }}
          name: SONIX ${{ github.event.inputs.version_name }}
          body: |
            SONIX application release
            - Version: ${{ github.event.inputs.version_name }}
            - Android versionCode: ${{ github.event.inputs.version_code }}
            - APK SHA-256 is included in SHA256SUMS.txt
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt

name: Android APK and unit tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "backup/**"
      - "security-hardening-no-http-change-20261114"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sonix-release-key.p12"
          test -s "$RUNNER_TEMP/sonix-release-key.p12"
          chmod 600 "$RUNNER_TEMP/sonix-release-key.p12"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sonix-release-key.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonix-tv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sonix-release-key.p12"
